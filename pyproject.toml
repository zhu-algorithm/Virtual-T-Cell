[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-t-cell"
version = "0.1.0"
description = "A reproducible T-cell transcriptomic perturbation simulator trained on public CROP-seq data."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "zhu-algorithm"}]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2,<4",
]

[project.optional-dependencies]
hdf5 = ["h5py>=3.10,<4"]

[project.scripts]
virtual-t-cell = "virtual_t_cell.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

