name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src app.py
      - name: Test
        run: python -m unittest discover -s tests -v

  atlas-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install atlas dependencies
        run: python -m pip install -e '.[atlas]'
      - name: Verify raw-count H5AD and batch ingestion
        run: python -m unittest discover -s tests -p 'test_learning_data.py' -v
