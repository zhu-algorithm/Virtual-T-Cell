name: Build T-cell subtype model
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Download public DICE and HGNC references
        run: |
          mkdir subtype_raw
          curl -L --fail --retry 5 -o subtype_raw/mean_tpm_merged.csv \
            'https://dice-database.org/download/mean_tpm_merged.csv'
          curl -L --fail --retry 5 -o subtype_raw/hgnc_complete_set.txt \
            'https://storage.googleapis.com/public-download-files/hgnc/tsv/tsv/hgnc_complete_set.txt'
      - name: Add sorted T-cell subtype context
        run: |
          virtual-t-cell prepare-subtypes \
            --base-model models/tcell_multiomics_evidence.npz \
            --dice-tpm subtype_raw/mean_tpm_merged.csv \
            --hgnc subtype_raw/hgnc_complete_set.txt \
            --out models/tcell_subtype_multiomics.npz
      - name: Validate requested subtypes end to end
        run: |
          for subtype in Treg Treg_naive Treg_memory Th17 Th1 Th2 CD8 CD8_naive CD4_naive; do
            virtual-t-cell predict --model models/tcell_subtype_multiomics.npz \
              --condition Teff_Stimulated --subtype "$subtype" --perturb ZAP70 \
              --out-dir "smoke/$subtype"
            test -s "smoke/$subtype/gene_predictions.csv"
            test -s "smoke/$subtype/multiomic_predictions.csv"
          done
      - name: Publish subtype model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f models/tcell_subtype_multiomics.npz models/tcell_subtype_multiomics.metrics.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish DICE T-cell subtype model v0.7'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tcell-subtype-multiomics-model
          path: models/tcell_subtype_multiomics*
          retention-days: 30
