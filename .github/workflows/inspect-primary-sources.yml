name: Inspect primary T-cell source schemas

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas openpyxl
      - name: Download compact published source tables
        run: |
          curl -L --fail --retry 5 -o data_tables.zip 'https://zenodo.org/records/13924126/files/data_tables.zip?download=1'
          curl -L --fail --retry 5 -o genome_wide_screens.zip 'https://zenodo.org/records/5784651/files/Genome-wide-screens.zip?download=1'
      - name: Inspect archive schemas
        run: python scripts/inspect_primary_sources.py data_tables.zip genome_wide_screens.zip
