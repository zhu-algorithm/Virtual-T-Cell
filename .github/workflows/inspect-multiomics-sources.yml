name: Inspect T-cell multi-omics sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download public processed sources
        run: |
          mkdir multiomics_raw
          curl -L --fail --retry 5 -o multiomics_raw/PXD021250_files.json \
            'https://www.ebi.ac.uk/pride/ws/archive/v2/projects/PXD021250/files'
          curl -L --fail --retry 5 -o multiomics_raw/PXD025174_files.json \
            'https://www.ebi.ac.uk/pride/ws/archive/v2/projects/PXD025174/files'
          protein_url=$(python -c "import json; x=json.load(open('multiomics_raw/PXD021250_files.json')); r=next(i for i in x if i['fileName']=='proteinGroups.txt'); print(next(p['value'] for p in r['publicFileLocations'] if p['name']=='FTP Protocol').replace('ftp://','https://'))")
          curl -L --fail --retry 5 -o multiomics_raw/proteinGroups.txt "$protein_url"
          curl -L --fail --retry 5 -o multiomics_raw/QTD000031.permuted.tsv.gz \
            'https://ftp.ebi.ac.uk/pub/databases/spot/eQTL/sumstats/QTS000002/QTD000031/QTD000031.permuted.tsv.gz'
          curl -L --fail --retry 5 -o multiomics_raw/GSE174666_processed.txt.gz \
            'https://ftp.ncbi.nlm.nih.gov/geo/series/GSE174nnn/GSE174666/suppl/GSE174666_processed.txt.gz'
      - run: python scripts/inspect_multiomics_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: multiomics-source-inspection
          path: multiomics_source_inspection.json
          retention-days: 30
